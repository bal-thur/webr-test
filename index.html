<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">


    <!-- Choices.js -->

    <link
        rel="stylesheet"
        href="./css/choices.min.css"
    >


    <!-- Application stylesheet -->

    <link
        rel="stylesheet"
        href="./css/app.css"
    >

</head>


<body>
  
  
  <div id="app-loading">
    <img
        src="./assets/logo.png"
        alt="Project logo"
    >

    <div class="app-loading-text">
        Loading WebR application...
    </div>
</div>

    <div id="app">


        <!-- ==================================================
             SIDEBAR
             ================================================== -->

        <aside
            id="sidebar"
            class="sidebar"
            aria-label="Navigation"
        >

            <div class="sidebar-brand">
<img src="./assets/logo.png" alt="Project logo">

                  <!--<div class="sidebar-title"> Lipidomic data analysis
                </div>-->

            </div>


            <nav
                id="module-navigation"
                class="module-navigation"
            >
                <!--
                    La navegación será creada
                    dinámicamente por app.js.
                -->
            </nav>

        </aside>


        <!-- ==================================================
             MAIN APPLICATION AREA
             ================================================== -->

        <main
            id="main"
            class="main"
        >

            <div
                id="module-container"
                class="module-container"
            >
                <!--
                    Los módulos se cargarán aquí.
                -->
            </div>

            <pre id="output">
Starting WebR...
            </pre>


        </main>

    </div>


    <!-- ==================================================
         Cargar librerias
         ================================================== -->

    <script src="./lib/choices/choices.min.js"> </script>
    <script src="./lib/plotly/plotly-3.7.0.min.js"> </script>
    <script src="./lib/ml-hclust-build/hclust.iife.js"></script>


    <!-- ==================================================
         Aplicación
         ================================================== -->

    <script
        type="module"
        src="./app.js"
    ></script>

</body>

</html>
