<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">


    <!-- Choices.js -->

    <link
        rel="stylesheet"
        href="./css/choices.min.css"
    >


    <!-- Application stylesheet -->

    <link
        rel="stylesheet"
        href="./css/app.css"
    >

</head>


<body>

    <div id="app">


        <!-- ==================================================
             SIDEBAR
             ================================================== -->

        <aside
            id="sidebar"
            class="sidebar"
            aria-label="Navigation"
        >

            <div class="sidebar-brand">
<img src="./assets/logo.png" alt="Project logo">

                  <!--<div class="sidebar-title"> Lipidomic data analysis
                </div>-->

            </div>


            <nav
                id="module-navigation"
                class="module-navigation"
            >
                <!--
                    La navegación será creada
                    dinámicamente por app.js.
                -->
            </nav>

        </aside>


        <!-- ==================================================
             MAIN APPLICATION AREA

        <main
            id="main"
            class="main"
        >

            <div
                id="module-container"

                    Los módulos se cargarán aquí.
                -->

            <!--
                Mantendremos temporalmente el output

            -->

            <pre id="output">
Starting WebR...

    <!-- ==================================================

    <script

    <!-- ==================================================
         Aplicación
         ================================================== -->

    <script

        src="./app.js"
